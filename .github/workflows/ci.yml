name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Read-only by default; nothing in this workflow writes back to the repo.
permissions:
  contents: read

# A newer push to the same ref makes older runs irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a first-class target: the RPC child resolves Pi's CLI
        # entry point specifically to avoid the .cmd shim there.
        os: [ubuntu-latest, windows-latest]
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run

  context-current-pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Pi with canonical context edits
        run: npm install --no-save --package-lock=false --ignore-scripts @earendil-works/pi-ai@1.1.0 @earendil-works/pi-agent-core@1.1.0 @earendil-works/pi-coding-agent@1.1.0 @earendil-works/pi-tui@1.1.0
      - name: Check side-question context against Pi 1.1.0
        run: node --experimental-transform-types --test test/context.test.mts
